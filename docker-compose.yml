# Standalone Docker Compose for Pesetech BLE Mesh Gateway.
#
# Prerequisites:
#   1. Copy your Pesetech mesh export to docker/pesetech_mesh.json
#   2. Copy .env.example to .env and fill in any values (MQTT_* are optional
#      when using the bundled Mosquitto broker)
#   3. Run: docker compose up --build
#
# The gateway and MQTT broker both use host networking so that bluetooth-meshd
# can open raw L2CAP sockets.  MQTT is reachable at localhost:1883 on the host.

services:
  mqtt:
    image: eclipse-mosquitto:2
    network_mode: host
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  gateway:
    build: ./pesetech_ble_mesh
    network_mode: host
    privileged: true
    depends_on:
      - mqtt
    env_file:
      - path: .env
        required: false
    environment:
      MQTT_HOST: ${MQTT_HOST:-127.0.0.1}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_SSL: ${MQTT_SSL:-}
    volumes:
      - ./docker/config:/data
      - ./docker/pesetech_mesh.json:/share/pesetech_mesh.json:ro
    restart: unless-stopped
