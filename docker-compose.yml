# Standalone Docker Compose for Pesetech BLE Mesh Gateway.
#
# Prerequisites:
#   1. Copy your Pesetech mesh export to docker/pesetech_mesh.json
#   2. Set MQTT_HOST in .env (see .env.example). Skip this step when using
#      the bundled broker — docker/defaults.env sets MQTT_HOST=127.0.0.1.
#   3. Run: docker compose up --build
#
# The gateway uses host networking so that bluetooth-meshd can open raw
# L2CAP sockets.
#
# Bundled Mosquitto broker (optional):
#   The broker is off by default.  Enable it with the "mqtt" profile:
#
#     COMPOSE_PROFILES=mqtt docker compose up --build
#     # or: docker compose --profile mqtt up --build
#
#   When using the bundled broker, omit MQTT_HOST — it defaults to 127.0.0.1.

services:
  mqtt:
    image: eclipse-mosquitto:2
    profiles: ["mqtt"]
    network_mode: host
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  gateway:
    build: .
    network_mode: host
    privileged: true
    env_file:
      - docker/defaults.env
      - path: .env
        required: false
    volumes:
      - ./docker/config:/data
      - ./docker/pesetech_mesh.json:/share/pesetech_mesh.json:ro
    restart: unless-stopped
