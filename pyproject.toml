[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pesetech-ble-mesh-gateway"
version = "1.0.0"
description = "Bridges Pesetech/Lepu BLE Mesh skylights to Home Assistant via MQTT Discovery"
requires-python = ">=3.10"
dependencies = [
    "asyncio-mqtt==0.12.1",
    "bitstring==3.1.9",
    "construct==2.9.45",
    "cryptography==3.3.2",
    "dbus-next==0.2.3",
    "marshmallow==3.17.1",
    "numpy==1.23.3",
    "pyyaml==6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
