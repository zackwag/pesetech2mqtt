version: "3.9"
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ./config:/config/
    environment:
      GATEWAY_MODE: "${GATEWAY_MODE:-shell}"
      GATEWAY_ARGS: "${GATEWAY_ARGS:---basedir /config --reload}"
      GATEWAY_HOME: /config
    restart: "always"
    network_mode: "host"
    privileged: true
    stdin_open: true
    tty: true
